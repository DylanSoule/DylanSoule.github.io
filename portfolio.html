<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dylan Soule | Personal Portfolio</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/portfolio.css" />
    <script defer type="module" src="js/main.js"></script>
  </head>
  <body>
    <main id="portfolio-page">
      <header class="portfolio-header">
        <div class="portfolio-title">
          <h1>My Portfolio</h1>
          <p>Please explore below by expanding folders</p>
        </div>
      </header>

      <nav class="floating-nav">
        <a href="index.html" class="nav-item">About</a>
        <a href="portfolio.html" class="nav-item active">Portfolio</a>
        <a href="contact.html" class="nav-item">Contact</a>
      </nav>

      <section class="directory portfolio">
        <h2>Explore</h2>
        <ul id="folder-tree"></ul>
      </section>
    </main>

    <button
      id="blowup-backdrop"
      class="blowup-backdrop"
      type="button"
      aria-label="Close details panel"
      hidden
    ></button>

    <!-- Side panel shell; content is injected into #blowup-content -->
    <aside
      id="blowup-panel"
      class="blowup-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="blowup-title"
      aria-hidden="true"
      hidden
    >
      <header class="blowup-panel-header">
        <h2 id="blowup-title">Details</h2>
        <button id="blowup-close" class="blowup-close" type="button" aria-label="Close details panel">
          Close
        </button>
      </header>

      <div id="blowup-content" class="blowup-content">
        <p>Select an item from the folder tree to view details.</p>
      </div>
    </aside>
  </body>
</html>
